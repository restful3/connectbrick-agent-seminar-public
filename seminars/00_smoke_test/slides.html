<!DOCTYPE html>
<html lang="ko" class="theme-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>00_smoke_test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script>Chart.defaults.animation = false;</script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <link rel="stylesheet" href="../../../template/theme_slides.css">
  <style id="brand-vars">:root{
  --running-header-left: "송태영 · Independent Research";
  --running-header-right: "TY SONG";
  --slide-section-monogram: "TS";
}</style>
</head>
<body>
  <a href="#main-content" class="skip-to-content" style="position:absolute;left:-9999px;">Skip to content</a>
  <div class="viz-menu">
    <button class="viz-menu-toggle" onclick="toggleMenu()" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/>
      </svg>
    </button>
    <div class="viz-menu-dropdown" id="vizMenuDropdown">
      <button onclick="cycleTheme()"><span id="themeIcon">☀️</span><span id="themeLabel">Light</span></button>
      <button onclick="downloadImage()"><span>📥</span><span>Download PNG</span></button>
      <button onclick="window.print()"><span>🖨️</span><span>Print / PDF</span></button>
    </div>
  </div>
  <div class="deck-progress"><div class="deck-progress__fill" id="progressFill"></div></div>
  <main id="main-content" role="main">
    <div class="deck">
      <div class="stage">
        <div class="slides" id="slidesContainer">
<section class="slide slide--cover" aria-label="Cover">
  <div class="cover-wordmark">
    <span class="cover-wordmark__name">송태영</span>
    <span class="cover-wordmark__sub">Agentic AI Research</span>
  </div>
  <div class="cover-signature">AI Odyssey · YouTube</div>
  <div class="cover-hero">
    <div class="cover-kicker animate-in">Seminar Deck</div>
    <h1 class="animate-in delay-1">00_smoke_test</h1>
    <p class="cover-subtitle animate-in delay-2">한 줄 부제</p>
  </div>
  <div class="cover-meta">
    <div><strong>발표자</strong>송태영</div>
    <div><strong>채널</strong>송태영</div>
    <div><strong>일시</strong></div>
  </div>
</section>
<section class="slide slide--closing" aria-label="감사합니다">
  <div class="slide-header">
    <div class="brand-mark"><div class="brand-mark__stack"><span class="brand-mark__name">송태영</span><span class="brand-mark__sub">Agentic AI Research</span></div></div>
    <div class="slide-section-tag">Thank you</div>
  </div>
  <div class="slide-body" style="justify-content:flex-start;">
    <div class="cover-kicker animate-in">Q&A</div>
    <h1 class="animate-in delay-1">감사합니다</h1>
    <p class="closing-sub animate-in delay-2">Q&amp;A</p>

  </div>
</section>
        </div>
      </div>
    </div>
    <nav class="slide-nav" aria-label="Slide navigation">
      <button onclick="prevSlide()" aria-label="Previous slide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="slide-counter"><span id="slideCur">1</span> / <span id="slideTotal">2</span></span>
      <button onclick="nextSlide()" aria-label="Next slide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </nav>
  </main>
  <script src="../../../template/deck.js"></script>
</body>
</html>
