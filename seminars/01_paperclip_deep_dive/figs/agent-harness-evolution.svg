<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 15 720 280" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow-harness" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/>
    </marker>
  </defs>
  <rect x="10" y="15" width="720" height="280" fill="#FAFAF9"/>

  <!-- 2025: 코딩 보조 -->
  <rect x="30" y="90" width="170" height="120" rx="8" fill="#E9F2FB" stroke="#2563EB" stroke-width="1.5"/>
  <text x="115" y="120" text-anchor="middle" font-size="11" fill="#6B6B72" letter-spacing="0.12em">2025</text>
  <text x="115" y="150" text-anchor="middle" font-size="16" font-weight="800" fill="#0F2C59">코딩 보조</text>
  <text x="115" y="178" text-anchor="middle" font-size="11" fill="#0F2C59">IDE plugin · CLI</text>

  <!-- Arrow 2025 → 2026 -->
  <line x1="210" y1="150" x2="295" y2="150" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-harness)"/>

  <!-- 2026: 업무 실행 런타임 -->
  <rect x="305" y="30" width="400" height="240" rx="8" fill="#FFFFFF" stroke="#0F2C59" stroke-width="2"/>
  <text x="505" y="60" text-anchor="middle" font-size="11" fill="#6B6B72" letter-spacing="0.12em">2026</text>
  <text x="505" y="88" text-anchor="middle" font-size="16" font-weight="800" fill="#0F2C59">업무 실행 런타임</text>

  <!-- Row 1: 환경 primitives (어두운 색) -->
  <rect x="315" y="110" width="92" height="65" rx="5" fill="#0F2C59"/>
  <text x="361" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">filesystem</text>
  <rect x="411" y="110" width="92" height="65" rx="5" fill="#0F2C59"/>
  <text x="457" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">sandbox</text>
  <rect x="507" y="110" width="92" height="65" rx="5" fill="#0F2C59"/>
  <text x="553" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">memory</text>
  <rect x="603" y="110" width="92" height="65" rx="5" fill="#0F2C59"/>
  <text x="649" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">tool</text>

  <!-- Row 2: 동작 primitives (밝은 색) -->
  <rect x="315" y="185" width="92" height="65" rx="5" fill="#2563EB"/>
  <text x="361" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">skill</text>
  <rect x="411" y="185" width="92" height="65" rx="5" fill="#2563EB"/>
  <text x="457" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">patch</text>
  <rect x="507" y="185" width="92" height="65" rx="5" fill="#2563EB"/>
  <text x="553" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">shell</text>
  <rect x="603" y="185" width="92" height="65" rx="5" fill="#2563EB"/>
