<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 800 305" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect x="0" y="80" width="800" height="305" fill="#FAFAF9"/>

  <!-- Pyramid: 10% / 30% / 60% from top -->
  <!-- Top: 10% Opus -->
  <polygon points="330,90 470,90 435,160 365,160" fill="#0F2C59" stroke="#0F2C59" stroke-width="1.5"/>
  <text x="400" y="120" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">10%</text>
  <text x="400" y="138" font-size="10" text-anchor="middle" fill="#FFFFFF" opacity="0.9">Opus / GPT-5</text>
  <text x="530" y="120" font-size="11" font-weight="600" fill="#0F2C59">→ 핵심 의사결정 · 라우팅 · CEO 전략</text>
  <text x="530" y="138" font-size="9" fill="#6B6B72">예: CEO strategy / brand-tone reviewer</text>

  <!-- Middle: 30% Sonnet -->
  <polygon points="310,170 490,170 510,260 290,260" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/>
  <text x="400" y="208" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">30%</text>
  <text x="400" y="228" font-size="11" text-anchor="middle" fill="#FFFFFF" opacity="0.95">Sonnet / GPT-5-mini</text>
  <text x="540" y="208" font-size="11" font-weight="600" fill="#0F2C59">→ 일반 작업 · 문서 생성 · 분석</text>
  <text x="540" y="228" font-size="9" fill="#6B6B72">예: 카피 초안 / 캠페인 분석 / 리뷰어</text>

  <!-- Bottom: 60% Haiku -->
  <polygon points="240,270 560,270 590,370 210,370" fill="#A7C7E7" stroke="#0F2C59" stroke-width="1.5"/>
  <text x="400" y="312" font-size="20" font-weight="700" text-anchor="middle" fill="#0F2C59">60%</text>
  <text x="400" y="336" font-size="12" text-anchor="middle" fill="#0F2C59">Haiku / Gemini Flash / GPT-5-nano</text>
  <text x="595" y="305" font-size="11" font-weight="600" fill="#0F2C59">→ 대량 처리 · 스크래핑 · 전처리</text>
  <text x="595" y="322" font-size="9" fill="#6B6B72">예: 리드 수집 / 정렬 / 분류 / 전처리</text>

  <!-- Cost label on side -->
  <g>
    <text x="60" y="120" font-size="10" font-weight="600" fill="#6B6B72">$$$$ 최고가</text>
    <line x1="60" y1="130" x2="60" y2="350" stroke="#6B6B72" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="60" y="365" font-size="10" font-weight="600" fill="#6B6B72">$ 최저가</text>
  </g>

</svg>
