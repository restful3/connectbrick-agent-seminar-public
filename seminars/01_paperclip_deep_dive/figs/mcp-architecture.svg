<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 75 800 285" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow-mcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/>
    </marker>
    <marker id="arrow-mcp-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#0F2C59"/>
    </marker>
  </defs>

  <rect x="0" y="75" width="800" height="285" fill="#FAFAF9"/>

  <!-- HOSTS (left column) -->
  <text x="120" y="85" font-size="13" font-weight="700" text-anchor="middle" fill="#0F2C59">MCP 호스트</text>
  <text x="120" y="100" font-size="10" text-anchor="middle" fill="#6B6B72">(클라이언트)</text>

  <g>
    <rect x="40" y="115" width="160" height="34" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="120" y="135" font-size="11" font-weight="500" text-anchor="middle" fill="#0F0F10">Claude Desktop</text>
  </g>
  <g>
    <rect x="40" y="155" width="160" height="34" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="120" y="175" font-size="11" font-weight="500" text-anchor="middle" fill="#0F0F10">Cursor</text>
  </g>
  <g>
    <rect x="40" y="195" width="160" height="34" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="120" y="215" font-size="11" font-weight="500" text-anchor="middle" fill="#0F0F10">Windsurf</text>
  </g>
  <g>
    <rect x="40" y="235" width="160" height="34" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="120" y="255" font-size="11" font-weight="500" text-anchor="middle" fill="#0F0F10">LM Studio (로컬)</text>
  </g>
  <g>
    <rect x="40" y="275" width="160" height="34" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="120" y="295" font-size="11" font-weight="500" text-anchor="middle" fill="#0F0F10">ChatGPT</text>
  </g>
  <g>
    <rect x="40" y="315" width="160" height="34" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="120" y="332" font-size="11" font-weight="500" text-anchor="middle" fill="#0F0F10">Google Antigravity</text>
    <text x="120" y="345" font-size="8" text-anchor="middle" fill="#6B6B72">(2026 신규)</text>
  </g>

  <!-- MCP Gateway (middle) -->
  <g>
    <rect x="290" y="180" width="220" height="100" rx="8" fill="#0F2C59"/>
    <text x="400" y="207" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">MCP 게이트웨이</text>
    <text x="400" y="226" font-size="10" text-anchor="middle" fill="#FFFFFF" opacity="0.85">라우팅 · 인증 · 비밀값</text>
    <line x1="310" y1="240" x2="490" y2="240" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="400" y="258" font-size="10" text-anchor="middle" fill="#FFFFFF" opacity="0.95">Docker MCP 게이트웨이</text>
    <text x="400" y="272" font-size="9" text-anchor="middle" fill="#FFFFFF" opacity="0.7">(서버 실행 관리)</text>
  </g>

  <!-- Arrows host → MCP -->
  <line x1="200" y1="132" x2="288" y2="200" stroke="#0F2C59" stroke-width="1" marker-end="url(#arrow-mcp)" opacity="0.45"/>
  <line x1="200" y1="172" x2="288" y2="215" stroke="#0F2C59" stroke-width="1" marker-end="url(#arrow-mcp)" opacity="0.45"/>
  <line x1="200" y1="212" x2="288" y2="230" stroke="#0F2C59" stroke-width="1" marker-end="url(#arrow-mcp)" opacity="0.45"/>
  <line x1="200" y1="252" x2="288" y2="245" stroke="#0F2C59" stroke-width="1" marker-end="url(#arrow-mcp)" opacity="0.45"/>
  <line x1="200" y1="292" x2="288" y2="258" stroke="#0F2C59" stroke-width="1" marker-end="url(#arrow-mcp)" opacity="0.45"/>
  <line x1="200" y1="332" x2="288" y2="271" stroke="#0F2C59" stroke-width="1" marker-end="url(#arrow-mcp)" opacity="0.45"/>

  <!-- DATA SOURCES (right column) -->
  <text x="680" y="85" font-size="13" font-weight="700" text-anchor="middle" fill="#0F2C59">데이터 소스</text>
  <text x="680" y="100" font-size="10" text-anchor="middle" fill="#6B6B72">(서버가 감쌈)</text>

  <g>
    <rect x="600" y="115" width="160" height="34" rx="5" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <text x="680" y="135" font-size="11" font-weight="500" text-anchor="middle" fill="#0F0F10">Google Drive / Sheets</text>
  </g>
  <g>
    <rect x="600" y="155" width="160" height="34" rx="5" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <text x="680" y="175" font-size="11" font-weight="500" text-anchor="middle" fill="#0F0F10">Postgres / SQLite</text>
  </g>
  <g>
    <rect x="600" y="195" width="160" height="34" rx="5" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <text x="680" y="215" font-size="11" font-weight="500" text-anchor="middle" fill="#0F0F10">Slack / Discord</text>
  </g>
  <g>
    <rect x="600" y="235" width="160" height="34" rx="5" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <text x="680" y="255" font-size="11" font-weight="500" text-anchor="middle" fill="#0F0F10">Shopify / Meta Ads</text>
  </g>
  <g>
    <rect x="600" y="275" width="160" height="34" rx="5" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <text x="680" y="295" font-size="11" font-weight="500" text-anchor="middle" fill="#0F0F10">자체 SaaS API</text>
  </g>
  <g>
    <rect x="600" y="315" width="160" height="34" rx="5" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="680" y="335" font-size="11" font-weight="500" text-anchor="middle" fill="#0F0F10">커스텀 / 확장</text>
  </g>

  <!-- Arrows MCP → data -->
  <line x1="512" y1="200" x2="598" y2="132" stroke="#0F2C59" stroke-width="1" marker-end="url(#arrow-mcp)" opacity="0.45"/>
  <line x1="512" y1="215" x2="598" y2="172" stroke="#0F2C59" stroke-width="1" marker-end="url(#arrow-mcp)" opacity="0.45"/>
  <line x1="512" y1="230" x2="598" y2="212" stroke="#0F2C59" stroke-width="1" marker-end="url(#arrow-mcp)" opacity="0.45"/>
  <line x1="512" y1="245" x2="598" y2="252" stroke="#0F2C59" stroke-width="1" marker-end="url(#arrow-mcp)" opacity="0.45"/>
  <line x1="512" y1="258" x2="598" y2="292" stroke="#0F2C59" stroke-width="1" marker-end="url(#arrow-mcp)" opacity="0.45"/>
  <line x1="512" y1="271" x2="598" y2="332" stroke="#0F2C59" stroke-width="1" marker-end="url(#arrow-mcp)" opacity="0.45"/>

</svg>
