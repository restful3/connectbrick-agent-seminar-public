<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 800 420" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow-oc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B6B72"/>
    </marker>
    <marker id="arrow-approve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/>
    </marker>
  </defs>

  <rect x="0" y="70" width="800" height="420" fill="#FAFAF9"/>

  <!-- Board (human) -->
  <g>
    <rect x="320" y="80" width="160" height="56" rx="6" fill="#0F2C59"/>
    <text x="400" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">BOARD (사람)</text>
    <text x="400" y="124" font-size="10" text-anchor="middle" fill="#FFFFFF" opacity="0.85">approve / pause / override</text>
  </g>

  <!-- CEO agent -->
  <g>
    <rect x="335" y="190" width="130" height="48" rx="6" fill="#FFFFFF" stroke="#0F2C59" stroke-width="2"/>
    <text x="400" y="213" font-size="12" font-weight="700" text-anchor="middle" fill="#0F2C59">CEO Agent</text>
    <text x="400" y="229" font-size="9" text-anchor="middle" fill="#6B6B72">strategy → approval</text>
  </g>
  <!-- Board → CEO (delegate goal) -->
  <line x1="400" y1="136" x2="400" y2="186" stroke="#6B6B72" stroke-width="1.5" marker-end="url(#arrow-oc)"/>
  <text x="408" y="167" font-size="9" fill="#6B6B72">goal 위임</text>

  <!-- CEO → Board (strategy approval) -->
  <path d="M 470 196 Q 540 165 470 136" fill="none" stroke="#E11D48" stroke-width="1.8" marker-end="url(#arrow-approve)" stroke-dasharray="4 3"/>
  <text x="525" y="172" font-size="9" font-weight="600" fill="#E11D48">strategy</text>
  <text x="525" y="184" font-size="9" font-weight="600" fill="#E11D48">approval</text>

  <!-- Manager layer (3) -->
  <g>
    <rect x="120" y="290" width="120" height="44" rx="6" fill="#FFFFFF" stroke="#0F2C59" stroke-width="1.5"/>
    <text x="180" y="312" font-size="11" font-weight="600" text-anchor="middle" fill="#0F2C59">Content Manager</text>
    <text x="180" y="326" font-size="9" text-anchor="middle" fill="#6B6B72">role: manager</text>
  </g>
  <g>
    <rect x="340" y="290" width="120" height="44" rx="6" fill="#FFFFFF" stroke="#0F2C59" stroke-width="1.5"/>
    <text x="400" y="312" font-size="11" font-weight="600" text-anchor="middle" fill="#0F2C59">Brand Manager</text>
    <text x="400" y="326" font-size="9" text-anchor="middle" fill="#6B6B72">role: manager</text>
  </g>
  <g>
    <rect x="560" y="290" width="120" height="44" rx="6" fill="#FFFFFF" stroke="#0F2C59" stroke-width="1.5"/>
    <text x="620" y="312" font-size="11" font-weight="600" text-anchor="middle" fill="#0F2C59">Publish Manager</text>
    <text x="620" y="326" font-size="9" text-anchor="middle" fill="#6B6B72">role: manager</text>
  </g>

  <!-- CEO → managers -->
  <line x1="370" y1="238" x2="200" y2="286" stroke="#6B6B72" stroke-width="1.5" marker-end="url(#arrow-oc)"/>
  <line x1="400" y1="238" x2="400" y2="286" stroke="#6B6B72" stroke-width="1.5" marker-end="url(#arrow-oc)"/>
  <line x1="430" y1="238" x2="600" y2="286" stroke="#6B6B72" stroke-width="1.5" marker-end="url(#arrow-oc)"/>

  <!-- Workers under content -->
  <g>
    <rect x="60" y="395" width="100" height="40" rx="5" fill="#FAFAF9" stroke="#6B6B72" stroke-width="1"/>
    <text x="110" y="415" font-size="10" font-weight="500" text-anchor="middle" fill="#0F0F10">Writer</text>
    <text x="110" y="427" font-size="8" text-anchor="middle" fill="#6B6B72">claude_local</text>
  </g>
  <g>
    <rect x="180" y="395" width="100" height="40" rx="5" fill="#FAFAF9" stroke="#6B6B72" stroke-width="1"/>
    <text x="230" y="415" font-size="10" font-weight="500" text-anchor="middle" fill="#0F0F10">Researcher</text>
    <text x="230" y="427" font-size="8" text-anchor="middle" fill="#6B6B72">codex_local</text>
  </g>
  <line x1="160" y1="334" x2="115" y2="391" stroke="#6B6B72" stroke-width="1" marker-end="url(#arrow-oc)"/>
  <line x1="200" y1="334" x2="225" y2="391" stroke="#6B6B72" stroke-width="1" marker-end="url(#arrow-oc)"/>

  <!-- Workers under brand -->
  <g>
    <rect x="345" y="395" width="110" height="40" rx="5" fill="#FAFAF9" stroke="#6B6B72" stroke-width="1"/>
    <text x="400" y="415" font-size="10" font-weight="500" text-anchor="middle" fill="#0F0F10">Brand Verifier</text>
    <text x="400" y="427" font-size="8" text-anchor="middle" fill="#6B6B72">brand-tone SKILL</text>
  </g>
  <line x1="400" y1="334" x2="400" y2="391" stroke="#6B6B72" stroke-width="1" marker-end="url(#arrow-oc)"/>

  <!-- Workers under publish -->
  <g>
    <rect x="525" y="395" width="100" height="40" rx="5" fill="#FAFAF9" stroke="#6B6B72" stroke-width="1"/>
    <text x="575" y="415" font-size="10" font-weight="500" text-anchor="middle" fill="#0F0F10">Postiz Pub</text>
    <text x="575" y="427" font-size="8" text-anchor="middle" fill="#6B6B72">http adapter</text>
  </g>
  <g>
    <rect x="640" y="395" width="100" height="40" rx="5" fill="#FAFAF9" stroke="#6B6B72" stroke-width="1"/>
    <text x="690" y="415" font-size="10" font-weight="500" text-anchor="middle" fill="#0F0F10">KR Channel Pub</text>
    <text x="690" y="427" font-size="8" text-anchor="middle" fill="#6B6B72">네이버/카카오</text>
  </g>
  <line x1="600" y1="334" x2="580" y2="391" stroke="#6B6B72" stroke-width="1" marker-end="url(#arrow-oc)"/>
  <line x1="640" y1="334" x2="680" y2="391" stroke="#6B6B72" stroke-width="1" marker-end="url(#arrow-oc)"/>

  <!-- Legend -->
  <text x="20" y="480" font-size="10" fill="#6B6B72">— 실선: 위임 (parent → child) · - - 점선(빨강): 승인 라인 (CEO → Board, 미승인 시 task 진행 차단)</text>
</svg>
