<svg xmlns="http://www.w3.org/2000/svg" viewBox="75 65 710 235" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow-skill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97706"/>
    </marker>
    <style>
      .loop { fill: #0F2C59; }
      .box { fill: #FFF7ED; stroke: #D97706; stroke-width: 2; }
      .active { fill: #FEF3C7; stroke: #D97706; stroke-width: 2.4; }
      .label { fill: #0F2C59; font-size: 15px; font-weight: 800; }
      .small { fill: #57534E; font-size: 11px; font-weight: 650; }
      .white { fill: #FFFFFF; font-size: 15px; font-weight: 800; }
      .white-small { fill: #FFFFFF; font-size: 11px; font-weight: 650; }
      .edge { stroke: #D97706; stroke-width: 2.5; fill: none; marker-end: url(#arrow-skill); }
      .dash { stroke: #D97706; stroke-width: 2; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow-skill); }
      .halo { paint-order: stroke fill; stroke: #FAFAF9; stroke-width: 4px; stroke-linejoin: round; }
    </style>
  </defs>

  <circle class="loop" cx="155" cy="178" r="62"/>
  <text x="155" y="170" text-anchor="middle" class="white">에이전트</text>
  <text x="155" y="190" text-anchor="middle" class="white-small">메인 루프</text>

  <rect class="box" x="316" y="78" width="160" height="54" rx="10"/>
  <text x="396" y="101" text-anchor="middle" class="label">스킬 인덱스</text>
  <text x="396" y="120" text-anchor="middle" class="small">이름 + 조건</text>

  <rect class="active" x="316" y="154" width="160" height="54" rx="10"/>
  <text x="396" y="177" text-anchor="middle" class="label">SKILL.md</text>
  <text x="396" y="196" text-anchor="middle" class="small">절차</text>

  <rect class="box" x="316" y="230" width="160" height="54" rx="10"/>
  <text x="396" y="253" text-anchor="middle" class="label">리소스</text>
  <text x="396" y="272" text-anchor="middle" class="small">스크립트 + 파일</text>

  <rect class="box" x="604" y="154" width="160" height="54" rx="10"/>
  <text x="684" y="177" text-anchor="middle" class="label">작업 결과</text>
  <text x="684" y="196" text-anchor="middle" class="small">같은 루프, 새 능력</text>

  <path class="edge" d="M214 165 C252 126 274 106 312 105"/>
  <path class="edge" d="M218 178 C252 178 280 181 312 181"/>
  <path class="dash" d="M214 194 C252 232 276 257 312 257"/>
  <path class="edge" d="M476 181 L600 181"/>
</svg>
