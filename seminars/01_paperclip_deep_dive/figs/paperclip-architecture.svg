<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 800 440" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow-arch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/>
    </marker>
    <style>
      .edge-label { paint-order: stroke fill; stroke: #FAFAF9; stroke-width: 3px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="20" width="800" height="440" fill="#FAFAF9"/>

  <!-- React UI (top center) -->
  <g>
    <rect x="340" y="30" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="400" y="60" font-size="13" font-weight="700" text-anchor="middle" fill="#0F2C59">React UI</text>
  </g>

  <!-- Arrow: React UI → Node.js API -->
  <line x1="400" y1="80" x2="400" y2="123" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-arch)"/>
  <text class="edge-label" x="412" y="105" font-size="10" fill="#6B6B72">REST / WS</text>

  <!-- Node.js API server (big container with 8 subsystem chips) -->
  <g>
    <rect x="80" y="130" width="640" height="215" rx="10" fill="#FFFFFF" stroke="#0F2C59" stroke-width="2.5"/>
    <text x="400" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#0F2C59">Node.js API 서버 — 운영 모듈</text>

    <!-- Chip row 1 -->
    <g>
      <rect x="102" y="176" width="140" height="54" rx="6" fill="#F5F5F4" stroke="#A8A29E" stroke-width="1"/>
      <text x="172" y="198" font-size="11" font-weight="700" text-anchor="middle" fill="#0F2C59">① Identity</text>
      <text x="172" y="216" font-size="9" text-anchor="middle" fill="#6B6B72">&amp; Access</text>
    </g>
    <g>
      <rect x="254" y="176" width="140" height="54" rx="6" fill="#F5F5F4" stroke="#A8A29E" stroke-width="1"/>
      <text x="324" y="198" font-size="11" font-weight="700" text-anchor="middle" fill="#0F2C59">② Org Chart</text>
      <text x="324" y="216" font-size="9" text-anchor="middle" fill="#6B6B72">&amp; Agents</text>
    </g>
    <g>
      <rect x="406" y="176" width="140" height="54" rx="6" fill="#F5F5F4" stroke="#A8A29E" stroke-width="1"/>
      <text x="476" y="198" font-size="11" font-weight="700" text-anchor="middle" fill="#0F2C59">③ Work &amp; Task</text>
      <text x="476" y="216" font-size="9" text-anchor="middle" fill="#6B6B72">Goal/Issue 트리</text>
    </g>
    <g>
      <rect x="558" y="176" width="140" height="54" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
      <text x="628" y="198" font-size="11" font-weight="700" text-anchor="middle" fill="#92400E">④ Heartbeat</text>
      <text x="628" y="216" font-size="9" text-anchor="middle" fill="#92400E">핵심 루프</text>
    </g>

    <!-- Chip row 2 -->
    <g>
      <rect x="102" y="246" width="140" height="54" rx="6" fill="#F5F5F4" stroke="#A8A29E" stroke-width="1"/>
      <text x="172" y="268" font-size="11" font-weight="700" text-anchor="middle" fill="#0F2C59">⑤ Workspaces</text>
      <text x="172" y="286" font-size="9" text-anchor="middle" fill="#6B6B72">git worktree</text>
    </g>
    <g>
      <rect x="254" y="246" width="140" height="54" rx="6" fill="#F5F5F4" stroke="#A8A29E" stroke-width="1"/>
      <text x="324" y="268" font-size="11" font-weight="700" text-anchor="middle" fill="#0F2C59">⑥ Governance</text>
      <text x="324" y="286" font-size="9" text-anchor="middle" fill="#6B6B72">&amp; Approvals</text>
    </g>
    <g>
      <rect x="406" y="246" width="140" height="54" rx="6" fill="#F5F5F4" stroke="#A8A29E" stroke-width="1"/>
      <text x="476" y="268" font-size="11" font-weight="700" text-anchor="middle" fill="#0F2C59">⑦ Budget</text>
      <text x="476" y="286" font-size="9" text-anchor="middle" fill="#6B6B72">&amp; Cost Control</text>
    </g>
    <g>
      <rect x="558" y="246" width="140" height="54" rx="6" fill="#F5F5F4" stroke="#A8A29E" stroke-width="1"/>
      <text x="628" y="268" font-size="11" font-weight="700" text-anchor="middle" fill="#0F2C59">⑧ Routines</text>
      <text x="628" y="286" font-size="9" text-anchor="middle" fill="#6B6B72">cron/webhook</text>
    </g>

    <!-- Annotation: 자세한 설명 = 표 참조 (없음 — 표에 위임) -->
  </g>

  <!-- Branch lines from Node.js to 3 backends -->
  <!-- vertical from Node.js bottom (400, 345) → (400, 365) -->
  <line x1="400" y1="345" x2="400" y2="365" stroke="#0F2C59" stroke-width="2"/>
  <!-- horizontal bar at y=365 from x=180 to x=620 -->
  <line x1="180" y1="365" x2="620" y2="365" stroke="#0F2C59" stroke-width="2"/>
  <!-- 3 down arrows from y=365 to y=388 (top of each box) -->
  <line x1="180" y1="365" x2="180" y2="388" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-arch)"/>
  <line x1="400" y1="365" x2="400" y2="388" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-arch)"/>
  <line x1="620" y1="365" x2="620" y2="388" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-arch)"/>

  <!-- PostgreSQL -->
  <g>
    <rect x="80" y="390" width="200" height="60" rx="6" fill="#FFFFFF" stroke="#0369A1" stroke-width="2"/>
    <text x="180" y="412" font-size="12" font-weight="700" text-anchor="middle" fill="#0F2C59">PostgreSQL</text>
    <text x="180" y="430" font-size="9" text-anchor="middle" fill="#6B6B72">issues · activity ·</text>
    <text x="180" y="443" font-size="9" text-anchor="middle" fill="#6B6B72">cost · secrets</text>
  </g>

  <!-- 외부 에이전트 어댑터 -->
  <g>
    <rect x="300" y="390" width="200" height="60" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <text x="400" y="412" font-size="12" font-weight="700" text-anchor="middle" fill="#0F2C59">외부 에이전트 어댑터</text>
    <text x="400" y="430" font-size="9" text-anchor="middle" fill="#6B6B72">Claude Code · Codex · CLI ·</text>
    <text x="400" y="443" font-size="9" text-anchor="middle" fill="#6B6B72">HTTP · Plugin</text>
  </g>

  <!-- Plugins -->
  <g>
    <rect x="520" y="390" width="200" height="60" rx="6" fill="#FFFFFF" stroke="#A8A29E" stroke-width="2"/>
    <text x="620" y="412" font-size="12" font-weight="700" text-anchor="middle" fill="#0F2C59">Plugins</text>
    <text x="620" y="430" font-size="9" text-anchor="middle" fill="#6B6B72">out-of-process</text>
    <text x="620" y="443" font-size="9" text-anchor="middle" fill="#6B6B72">workers</text>
  </g>
</svg>
