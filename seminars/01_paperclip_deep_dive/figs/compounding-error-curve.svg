<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 30 760 330" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <style>
      .small { font-size: 12px; fill: #6B6B72; }
      .axis { font-size: 13px; fill: #3F3F46; font-weight: 700; }
      .line-label { paint-order: stroke fill; stroke: #FAFAF9; stroke-width: 4px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="20" y="30" width="760" height="330" fill="#FAFAF9"/>
  <rect x="92" y="50" width="600" height="250" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- grid -->
  <line x1="92" y1="50" x2="692" y2="50" stroke="#E5E7EB"/>
  <line x1="92" y1="112.5" x2="692" y2="112.5" stroke="#E5E7EB"/>
  <line x1="92" y1="175" x2="692" y2="175" stroke="#E5E7EB"/>
  <line x1="92" y1="237.5" x2="692" y2="237.5" stroke="#E5E7EB"/>
  <line x1="92" y1="300" x2="692" y2="300" stroke="#71717A" stroke-width="1.3"/>

  <!-- y labels -->
  <text x="78" y="54" text-anchor="end" class="small">100%</text>
  <text x="78" y="116.5" text-anchor="end" class="small">75%</text>
  <text x="78" y="179" text-anchor="end" class="small">50%</text>
  <text x="78" y="241.5" text-anchor="end" class="small">25%</text>
  <text x="78" y="304" text-anchor="end" class="small">0%</text>

  <!-- x labels -->
  <line x1="92" y1="300" x2="92" y2="306" stroke="#71717A"/>
  <line x1="358.7" y1="300" x2="358.7" y2="306" stroke="#71717A"/>
  <line x1="692" y1="300" x2="692" y2="306" stroke="#71717A"/>
  <text x="92" y="326" text-anchor="middle" class="small">1</text>
  <text x="358.7" y="326" text-anchor="middle" class="small">5</text>
  <text x="692" y="326" text-anchor="middle" class="small">10</text>
  <text x="392" y="352" text-anchor="middle" class="axis">단계 수</text>
  <text x="34" y="175" text-anchor="middle" class="axis" transform="rotate(-90 34 175)">최종 성공률</text>

  <!-- curves: final success = per-step success ^ number of steps -->
  <polyline points="92,100 158.7,140 225.3,172 292,197.6 358.7,218.1 425.3,234.5 492,247.6 558.7,258.1 625.3,266.4 692,273.2"
    fill="none" stroke="#71717A" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="92,75 158.7,97.5 225.3,117.8 292,136 358.7,152.4 425.3,167.1 492,180.4 558.7,192.4 625.3,203.1 692,212.8"
    fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="92,62.5 158.7,74.4 225.3,85.6 292,96.4 358.7,106.6 425.3,116.2 492,125.4 558.7,134.1 625.3,142.4 692,150.3"
    fill="none" stroke="#0F2C59" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- direct labels -->
  <text class="line-label" x="708" y="155" font-size="13" font-weight="800" fill="#0F2C59">단계당 95%</text>
  <text class="line-label" x="708" y="217" font-size="13" font-weight="800" fill="#2563EB">단계당 90%</text>
  <text class="line-label" x="708" y="277" font-size="13" font-weight="800" fill="#71717A">단계당 80%</text>

  <!-- key points -->
  <circle cx="358.7" cy="152.4" r="7" fill="#E11D48" stroke="#FFFFFF" stroke-width="3"/>
  <text class="line-label" x="345" y="142" text-anchor="end" font-size="13" font-weight="900" fill="#E11D48">90% × 5 = 59%</text>

  <circle cx="692" cy="150.3" r="7" fill="#E11D48" stroke="#FFFFFF" stroke-width="3"/>
  <text class="line-label" x="680" y="133" text-anchor="end" font-size="13" font-weight="900" fill="#E11D48">95% × 10 = 60%</text>
</svg>
