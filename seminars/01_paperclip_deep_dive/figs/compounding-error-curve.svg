<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 30 565 270" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <style>.lbl { paint-order: stroke fill; stroke: #FAFAF9; stroke-width: 3px; stroke-linejoin: round; }</style>
  </defs>
  <rect x="20" y="30" width="565" height="270" fill="#FAFAF9"/>

  <!-- Grid lines -->
  <line x1="80" y1="50" x2="560" y2="50" stroke="#E5E7EB" stroke-width="0.7"/>
  <line x1="80" y1="145" x2="560" y2="145" stroke="#E5E7EB" stroke-width="0.7"/>
  <line x1="80" y1="240" x2="560" y2="240" stroke="#6B6B72" stroke-width="1"/>

  <!-- Y axis labels -->
  <text x="72" y="54" font-size="10" text-anchor="end" fill="#6B6B72">100%</text>
  <text x="72" y="149" font-size="10" text-anchor="end" fill="#6B6B72">50%</text>
  <text x="72" y="244" font-size="10" text-anchor="end" fill="#6B6B72">0%</text>

  <!-- X axis ticks -->
  <line x1="80" y1="240" x2="80" y2="245" stroke="#6B6B72"/>
  <line x1="293.33" y1="240" x2="293.33" y2="245" stroke="#6B6B72"/>
  <line x1="560" y1="240" x2="560" y2="245" stroke="#6B6B72"/>
  <text x="80" y="260" font-size="10" text-anchor="middle" fill="#6B6B72">1</text>
  <text x="293.33" y="260" font-size="10" text-anchor="middle" fill="#6B6B72">5</text>
  <text x="560" y="260" font-size="10" text-anchor="middle" fill="#6B6B72">10</text>
  <text x="320" y="285" font-size="11" text-anchor="middle" fill="#0F0F10" font-weight="600">단계 수</text>

  <!-- Y axis title (rotated) -->
  <text x="35" y="145" font-size="11" text-anchor="middle" fill="#0F0F10" font-weight="600" transform="rotate(-90 35 145)">최종 성공률</text>

  <!-- 80% curve (dashed grey) -->
  <polyline points="80,88 133.33,118.4 186.67,142.72 240,162.18 293.33,177.74 346.67,190.2 400,200.16 453.33,208.12 506.67,214.5 560,219.59" fill="none" stroke="#6B6B72" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="lbl" x="90" y="84" font-size="11" font-weight="700" fill="#6B6B72">단계당 80%</text>

  <!-- 90% curve (blue) -->
  <polyline points="80,69 133.33,86.1 186.67,101.49 240,115.34 293.33,127.81 346.67,139.03 400,149.13 453.33,158.21 506.67,166.4 560,173.75" fill="none" stroke="#2563EB" stroke-width="2"/>
  <text class="lbl" x="90" y="65" font-size="11" font-weight="700" fill="#2563EB">단계당 90%</text>

  <!-- 95% curve (navy) -->
  <polyline points="80,59.5 133.33,68.525 186.67,77.09 240,85.24 293.33,92.98 346.67,100.33 400,107.31 453.33,113.96 506.67,120.27 560,126.24" fill="none" stroke="#0F2C59" stroke-width="2"/>
  <text class="lbl" x="90" y="55" font-size="11" font-weight="700" fill="#0F2C59">단계당 95%</text>

  <!-- Anchor: 90% × 5 = 59% -->
  <circle cx="293.33" cy="127.81" r="5" fill="#E11D48" stroke="#FFFFFF" stroke-width="2"/>
  <text class="lbl" x="287" y="120" font-size="11" font-weight="800" fill="#E11D48" text-anchor="end">59%</text>

  <!-- Anchor: 95% × 10 = 60% -->
  <circle cx="560" cy="126.24" r="5" fill="#E11D48" stroke="#FFFFFF" stroke-width="2"/>
  <text class="lbl" x="555" y="120" font-size="11" font-weight="800" fill="#E11D48" text-anchor="end">60%</text>
</svg>
