<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="iceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="iceBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#FAFAF9"/>

  <text x="400" y="30" font-size="18" font-weight="600" text-anchor="middle" fill="#0F2C59">Iceberg Technique — 컨텍스트에 10\~20%만 노출</text>
  <text x="400" y="50" font-size="12" text-anchor="middle" fill="#6B6B72">전체 자산을 prompt에 넣지 말고, 인덱스만 + read/grep 도구로 lazy-load (Nick Saraev)</text>

  <!-- waterline -->
  <rect x="0" y="200" width="800" height="280" fill="url(#waterGrad)"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="780" y="195" font-size="10" text-anchor="end" fill="#0369A1">— context window 한계선 —</text>

  <!-- Iceberg above water (visible 10-20%) -->
  <polygon points="350,90 450,90 480,200 320,200" fill="url(#iceTop)" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="130" font-size="16" font-weight="700" text-anchor="middle" fill="#0F2C59">10\~20%</text>
  <text x="400" y="155" font-size="11" text-anchor="middle" fill="#0F2C59">파일 제목 + 인덱스</text>
  <text x="400" y="175" font-size="11" text-anchor="middle" fill="#0F2C59">read/grep 도구</text>

  <!-- Iceberg below water (hidden 80-90%) -->
  <polygon points="320,200 480,200 530,450 270,450" fill="url(#iceBot)" stroke="#0369A1" stroke-width="1.5" opacity="0.85"/>
  <text x="400" y="270" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">80\~90%</text>
  <text x="400" y="300" font-size="13" text-anchor="middle" fill="#FFFFFF">전체 자산 (소스 코드 / 문서 / DB)</text>
  <text x="400" y="320" font-size="11" font-style="italic" text-anchor="middle" fill="#FFFFFF" opacity="0.9">— 호출 시에만 컨텍스트로 로드 —</text>

  <text x="400" y="370" font-size="11" text-anchor="middle" fill="#FFFFFF">read("brand-tone-ch3.md")</text>
  <text x="400" y="388" font-size="11" text-anchor="middle" fill="#FFFFFF">grep("원산지 표기", "*.md")</text>
  <text x="400" y="406" font-size="11" text-anchor="middle" fill="#FFFFFF">query("INSERT/UPDATE SQL")</text>

  <!-- Side note: AS-IS vs TO-BE -->
  <g>
    <rect x="20" y="80" width="240" height="120" rx="6" fill="#FEE2E2" stroke="#E11D48" stroke-width="1"/>
    <text x="140" y="100" font-size="11" font-weight="700" text-anchor="middle" fill="#991B1B">AS-IS — 전체 dump</text>
    <text x="140" y="120" font-size="10" text-anchor="middle" fill="#7F1D1D">prompt에 모든 자산 첨부</text>
    <text x="140" y="138" font-size="10" text-anchor="middle" fill="#7F1D1D">→ 200K window 빠른 소진</text>
    <text x="140" y="156" font-size="10" text-anchor="middle" fill="#7F1D1D">→ 컨텍스트 폭주</text>
    <text x="140" y="174" font-size="10" text-anchor="middle" fill="#7F1D1D">→ 토큰 비용 burn</text>
    <text x="140" y="192" font-size="10" font-style="italic" text-anchor="middle" fill="#991B1B">+ LLM 성능 하락</text>
  </g>

  <g>
    <rect x="540" y="80" width="240" height="120" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
    <text x="660" y="100" font-size="11" font-weight="700" text-anchor="middle" fill="#065F46">TO-BE — Iceberg</text>
    <text x="660" y="120" font-size="10" text-anchor="middle" fill="#064E3B">prompt에 인덱스 + 도구만</text>
    <text x="660" y="138" font-size="10" text-anchor="middle" fill="#064E3B">→ context 1/5\~1/10</text>
    <text x="660" y="156" font-size="10" text-anchor="middle" fill="#064E3B">→ 필요한 부분만 호출</text>
    <text x="660" y="174" font-size="10" text-anchor="middle" fill="#064E3B">→ 토큰 곡선 완만</text>
    <text x="660" y="192" font-size="10" font-style="italic" text-anchor="middle" fill="#065F46">+ LLM 성능 유지</text>
  </g>

  <text x="400" y="487" font-size="10" font-style="italic" text-anchor="middle" fill="#6B6B72">F&B 적용 — 전체 브랜드 가이드 30 페이지를 매 호출에 넣지 말고, "주제별 인덱스 + 검색 도구"만 노출</text>
</svg>
