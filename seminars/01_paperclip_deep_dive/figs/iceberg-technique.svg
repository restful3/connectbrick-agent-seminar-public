<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 80 400 380" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="iceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="iceBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect x="200" y="80" width="400" height="380" fill="#FAFAF9"/>

  <!-- waterline -->
  <rect x="0" y="200" width="800" height="280" fill="url(#waterGrad)"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Iceberg above water (visible 10-20%) -->
  <polygon points="350,90 450,90 480,200 320,200" fill="url(#iceTop)" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="130" font-size="16" font-weight="700" text-anchor="middle" fill="#0F2C59">10~20%</text>
  <text x="400" y="155" font-size="11" text-anchor="middle" fill="#0F2C59">파일 제목 + 인덱스</text>
  <text x="400" y="175" font-size="11" text-anchor="middle" fill="#0F2C59">read/grep 도구</text>

  <!-- Iceberg below water (hidden 80-90%) -->
  <polygon points="320,200 480,200 530,450 270,450" fill="url(#iceBot)" stroke="#0369A1" stroke-width="1.5" opacity="0.85"/>
  <text x="400" y="290" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">80~90%</text>
  <text x="400" y="320" font-size="13" text-anchor="middle" fill="#FFFFFF">전체 자산</text>
  <text x="400" y="342" font-size="12" text-anchor="middle" fill="#FFFFFF" opacity="0.9">소스 코드 · 문서 · DB</text>
</svg>
