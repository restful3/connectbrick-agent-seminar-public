    <path d="M278 91 C258 98 240 108 232 116" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-4way-green)"/>
    <path d="M132 153 C152 146 170 136 178 128" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-4way-green)"/>
    <path d="M278 153 C258 146 240 136 232 128" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-4way-green)"/>
  </g>

