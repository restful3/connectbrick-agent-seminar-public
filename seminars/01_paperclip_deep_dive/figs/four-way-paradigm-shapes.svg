    <circle class="turn" cx="205" cy="122" r="42"/>
    <text class="tiny" x="205" y="126" text-anchor="middle">manager</text>
    <circle class="turn" cx="105" cy="72" r="34"/>
    <text class="tiny" x="105" y="76" text-anchor="middle">researcher</text>
    <circle class="turn" cx="305" cy="72" r="34"/>
    <text class="tiny" x="305" y="76" text-anchor="middle">writer</text>
    <circle class="turn" cx="105" cy="172" r="34"/>
