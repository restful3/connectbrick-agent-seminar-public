    <line x1="124" y1="142" x2="160" y2="142" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-4way-blue)"/>
    <path d="M246 142 C260 142 266 116 282 116" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-4way-blue)"/>
    <path d="M246 142 C260 142 266 182 282 182" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-4way-blue)"/>
