    <rect class="issue" x="70" y="124" width="84" height="38" rx="8"/>
    <text class="tiny" x="112" y="148" text-anchor="middle">Director</text>
    <rect class="issue" x="256" y="124" width="84" height="38" rx="8"/>
    <text class="tiny" x="298" y="148" text-anchor="middle">Worker</text>
    <line x1="205" y1="92" x2="113" y2="120" stroke="#E11D48" stroke-width="2" marker-end="url(#arrow-4way-red)"/>
    <line x1="205" y1="92" x2="297" y2="120" stroke="#E11D48" stroke-width="2" marker-end="url(#arrow-4way-red)"/>
    <rect x="146" y="180" width="118" height="26" rx="13" fill="#0F2C59"/>
    <text x="205" y="198" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">approval / budget</text>
    <path d="M112 162 C122 182 138 192 144 193" fill="none" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-4way-ink)"/>
    <path d="M298 162 C288 182 272 192 266 193" fill="none" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-4way-ink)"/>
