    <text class="sub" x="24" y="56">main loop · staged load</text>
    <circle cx="126" cy="132" r="44" fill="#0F2C59"/>
    <text x="126" y="127" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">agent</text>
    <text x="126" y="144" text-anchor="middle" font-size="10" font-weight="650" fill="#FFFFFF">loop</text>
    <rect class="skill" x="236" y="54" width="110" height="38" rx="6"/>
    <text class="tiny" x="291" y="78" text-anchor="middle">SKILL.md</text>
    <rect class="skill" x="236" y="114" width="110" height="38" rx="6"/>
    <text class="tiny" x="291" y="138" text-anchor="middle">script</text>
    <rect class="skill" x="236" y="174" width="110" height="38" rx="6"/>
    <text class="tiny" x="291" y="198" text-anchor="middle">resource</text>
    <line x1="170" y1="115" x2="232" y2="78" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-4way-ink)"/>
    <line x1="174" y1="132" x2="232" y2="132" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-4way-ink)"/>
    <line x1="170" y1="149" x2="232" y2="188" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-4way-ink)"/>
