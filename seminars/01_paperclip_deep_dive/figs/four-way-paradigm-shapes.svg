<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow-4way-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-4way-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-4way-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/>
    </marker>
    <marker id="arrow-4way-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/>
    </marker>
    <style>
      .panel { fill: #FFFFFF; stroke: #D6D3D1; stroke-width: 1.5; }
      .label { fill: #0F2C59; font-size: 16px; font-weight: 800; }
      .sub { fill: #57534E; font-size: 12px; font-weight: 650; }
      .tiny { fill: #57534E; font-size: 10px; font-weight: 650; }
      .node { fill: #E9F2FB; stroke: #2563EB; stroke-width: 1.6; }
      .turn { fill: #ECFDF5; stroke: #059669; stroke-width: 1.6; }
      .skill { fill: #FFF7ED; stroke: #D97706; stroke-width: 1.6; }
      .issue { fill: #FEE2E2; stroke: #E11D48; stroke-width: 1.6; }
      .edge-label { paint-order: stroke fill; stroke: #FAFAF9; stroke-width: 3px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="500" fill="#FAFAF9"/>

  <g transform="translate(24 24)">
    <rect class="panel" x="0" y="0" width="410" height="210" rx="8"/>
