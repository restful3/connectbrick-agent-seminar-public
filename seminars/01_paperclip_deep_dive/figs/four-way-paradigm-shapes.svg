    <text class="sub" x="24" y="56">step · state · edge</text>
    <rect class="node" x="42" y="118" width="82" height="48" rx="8"/>
    <text class="tiny" x="83" y="146" text-anchor="middle">research</text>
    <rect class="node" x="164" y="118" width="82" height="48" rx="8"/>
    <text class="tiny" x="205" y="146" text-anchor="middle">draft</text>
    <rect class="node" x="286" y="92" width="82" height="48" rx="8"/>
