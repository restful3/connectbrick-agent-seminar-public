<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 8 710 435" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="axis-arrow-fit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/>
    </marker>
    <style>
      .axis { stroke: #0F2C59; stroke-width: 2; marker-end: url(#axis-arrow-fit); }
      .grid { stroke: #D6D3D1; stroke-width: 1; stroke-dasharray: 5 5; }
      .label { fill: #0F2C59; font-size: 13px; font-weight: 800; }
      .muted { fill: #57534E; font-size: 11px; font-weight: 650; }
      .bubble-text { fill: #FFFFFF; font-size: 12px; font-weight: 800; }
      .halo { paint-order: stroke fill; stroke: #FAFAF9; stroke-width: 4px; stroke-linejoin: round; }
    </style>
  </defs>

  <line class="grid" x1="390" y1="45" x2="390" y2="385"/>
  <line class="grid" x1="80" y1="215" x2="700" y2="215"/>

  <line class="axis" x1="80" y1="385" x2="710" y2="385"/>
  <line class="axis" x1="80" y1="385" x2="80" y2="35"/>

  <text class="label" x="80" y="420" text-anchor="middle">고정 흐름</text>
  <text class="label" x="700" y="420" text-anchor="middle">가변 흐름</text>
  <text class="label" x="98" y="28">강한 차단 거버넌스</text>
  <text class="label" x="98" y="372">낮은 거버넌스</text>

  <rect x="455" y="70" width="205" height="96" rx="8" fill="#FEE2E2" opacity="0.55"/>

  <circle cx="250" cy="170" r="38" fill="#2563EB"/>
  <text class="bubble-text" x="250" y="174" text-anchor="middle">Graph</text>
  <text class="muted halo" x="250" y="226" text-anchor="middle">명시적 단계</text>

  <circle cx="535" cy="255" r="38" fill="#059669"/>
  <text class="bubble-text" x="535" y="259" text-anchor="middle">Role-play</text>
  <text class="muted halo" x="535" y="306" text-anchor="middle">대화 수렴</text>

  <circle cx="230" cy="305" r="38" fill="#D97706"/>
  <text class="bubble-text" x="230" y="309" text-anchor="middle">Skill</text>
  <text class="muted halo" x="230" y="356" text-anchor="middle">단일 루프</text>

  <circle cx="560" cy="140" r="42" fill="#E11D48"/>
  <text class="bubble-text" x="560" y="144" text-anchor="middle">조직형</text>
  <text class="muted halo" x="560" y="196" text-anchor="middle">런타임 차단</text>
</svg>
