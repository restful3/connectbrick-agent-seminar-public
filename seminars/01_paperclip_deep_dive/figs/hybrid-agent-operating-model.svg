<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow-hybrid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/>
    </marker>
    <style>
      .box { fill: #FFFFFF; stroke: #D6D3D1; stroke-width: 1.5; }
      .org { fill: #FEE2E2; stroke: #E11D48; stroke-width: 1.7; }
      .graph { fill: #E9F2FB; stroke: #2563EB; stroke-width: 1.7; }
      .role { fill: #ECFDF5; stroke: #059669; stroke-width: 1.7; }
      .skill { fill: #FFF7ED; stroke: #D97706; stroke-width: 1.7; }
      .label { fill: #0F2C59; font-size: 13px; font-weight: 800; }
      .small { fill: #57534E; font-size: 10px; font-weight: 650; }
      .edge-label { paint-order: stroke fill; stroke: #FAFAF9; stroke-width: 3px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="390" fill="#FAFAF9"/>

  <rect class="org" x="30" y="64" width="150" height="70" rx="8"/>
  <text class="label" x="105" y="94" text-anchor="middle">Goal</text>
  <text class="small" x="105" y="114" text-anchor="middle">project issue</text>

  <rect class="org" x="238" y="64" width="150" height="70" rx="8"/>
  <text class="label" x="313" y="94" text-anchor="middle">Delegate</text>
  <text class="small" x="313" y="114" text-anchor="middle">org chart</text>

  <rect class="role" x="456" y="34" width="150" height="70" rx="8"/>
  <text class="label" x="531" y="64" text-anchor="middle">Draft Crew</text>
  <text class="small" x="531" y="84" text-anchor="middle">role discussion</text>

  <rect class="graph" x="456" y="146" width="150" height="70" rx="8"/>
  <text class="label" x="531" y="176" text-anchor="middle">Review Gate</text>
  <text class="small" x="531" y="196" text-anchor="middle">HITL checkpoint</text>

  <rect class="org" x="690" y="92" width="150" height="70" rx="8"/>
  <text class="label" x="765" y="122" text-anchor="middle">Publish</text>
  <text class="small" x="765" y="142" text-anchor="middle">approved task</text>

  <rect class="skill" x="220" y="286" width="440" height="54" rx="8"/>
  <text class="label" x="440" y="309" text-anchor="middle">Shared Skill Assets</text>
  <text class="small" x="440" y="328" text-anchor="middle">brand tone · SOP · checklist · scripts</text>

  <line x1="180" y1="99" x2="234" y2="99" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-hybrid)"/>
  <path d="M388 92 C410 74 430 69 452 69" fill="none" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-hybrid)"/>
  <path d="M388 106 C410 144 430 181 452 181" fill="none" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-hybrid)"/>
  <path d="M606 69 C646 74 666 92 686 112" fill="none" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-hybrid)"/>
  <path d="M606 181 C646 174 666 150 686 134" fill="none" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-hybrid)"/>

  <path d="M330 286 C330 230 332 178 332 134" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M530 286 C530 248 530 238 530 216" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M590 286 C646 246 700 188 742 162" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4"/>

  <rect x="310" y="222" width="260" height="30" rx="15" fill="#0F2C59"/>
  <text x="440" y="242" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">organization backbone + local patterns</text>
</svg>
