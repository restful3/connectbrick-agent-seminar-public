<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="820" height="350" fill="#FAFAF9"/>
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="800" fill="#0F2C59">Agent Production Discipline Snapshot</text>
  <text x="410" y="58" text-anchor="middle" font-size="12" fill="#6B6B72">LangChain State of Agent Engineering 2025/2026, n=1,340</text>

  <g transform="translate(70,95)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0F0F10">Production adoption</text>
    <rect x="0" y="18" width="500" height="24" rx="5" fill="#E5E7EB"/>
    <rect x="0" y="18" width="286.5" height="24" rx="5" fill="#2563EB"/>
    <text x="510" y="36" font-size="14" font-weight="800" fill="#0F2C59">57.3%</text>
    <text x="0" y="62" font-size="11" fill="#6B6B72">전체 응답자 기준 agent production 운영</text>
  </g>

  <g transform="translate(70,165)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0F0F10">Observability</text>
    <rect x="0" y="18" width="500" height="24" rx="5" fill="#E5E7EB"/>
    <rect x="0" y="18" width="445" height="24" rx="5" fill="#0F2C59"/>
    <text x="510" y="36" font-size="14" font-weight="800" fill="#0F2C59">89%</text>
    <text x="0" y="62" font-size="11" fill="#6B6B72">어떤 형태로든 observability 도입</text>
  </g>

  <g transform="translate(70,235)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0F0F10">Offline evaluation</text>
    <rect x="0" y="18" width="500" height="24" rx="5" fill="#E5E7EB"/>
    <rect x="0" y="18" width="262" height="24" rx="5" fill="#A7C7E7" stroke="#0F2C59" stroke-width="1"/>
    <text x="510" y="36" font-size="14" font-weight="800" fill="#0F2C59">52.4%</text>
    <text x="0" y="62" font-size="11" fill="#6B6B72">test set 기반 offline eval 운영</text>
  </g>

  <g transform="translate(635,103)">
    <rect x="0" y="0" width="125" height="150" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="62.5" y="28" text-anchor="middle" font-size="12" font-weight="800" fill="#0F2C59">Top blocker</text>
    <text x="62.5" y="78" text-anchor="middle" font-size="38" font-weight="900" fill="#E11D48">32%</text>
    <text x="62.5" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#0F0F10">Quality</text>
    <text x="62.5" y="128" text-anchor="middle" font-size="10" fill="#6B6B72">production 진입</text>
    <text x="62.5" y="143" text-anchor="middle" font-size="10" fill="#6B6B72">최대 장애물</text>
  </g>
</svg>
