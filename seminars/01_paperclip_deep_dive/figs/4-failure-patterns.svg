<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 800 380" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect x="0" y="80" width="800" height="380" fill="#FAFAF9"/>

  <!-- Quadrant grid (2x2) -->
  <line x1="400" y1="80" x2="400" y2="460" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="50" y1="270" x2="750" y2="270" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Q1: Context Anxiety (top-left) -->
  <g>
    <rect x="70" y="100" width="310" height="150" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="225" y="125" font-size="13" font-weight="700" text-anchor="middle" fill="#92400E">① Context Anxiety</text>
    <text x="225" y="146" font-size="11" text-anchor="middle" fill="#0F0F10">컨텍스트 차오르면</text>
    <text x="225" y="162" font-size="11" font-weight="600" text-anchor="middle" fill="#0F0F10">"다 끝났다"고 조기 선언</text>
    <line x1="100" y1="180" x2="350" y2="180" stroke="#D97706" stroke-width="0.5" stroke-dasharray="2 2"/>
    <text x="225" y="200" font-size="9" font-weight="600" text-anchor="middle" fill="#92400E">대응</text>
    <text x="225" y="216" font-size="10" text-anchor="middle" fill="#0F0F10">review stage에 *정량 기준* 박기</text>
    <text x="225" y="232" font-size="9" font-style="italic" text-anchor="middle" fill="#6B6B72">(최소 길이/항목 수 검증)</text>
  </g>

  <!-- Q2: Poor Self-eval (top-right) -->
  <g>
    <rect x="420" y="100" width="310" height="150" rx="6" fill="#FEE2E2" stroke="#E11D48" stroke-width="1.5"/>
    <text x="575" y="125" font-size="13" font-weight="700" text-anchor="middle" fill="#991B1B">② Poor Self-evaluation</text>
    <text x="575" y="146" font-size="11" text-anchor="middle" fill="#0F0F10">자기 결과물을</text>
    <text x="575" y="162" font-size="11" font-weight="600" text-anchor="middle" fill="#0F0F10">칭찬하며 통과시킴</text>
    <line x1="450" y1="180" x2="700" y2="180" stroke="#E11D48" stroke-width="0.5" stroke-dasharray="2 2"/>
    <text x="575" y="200" font-size="9" font-weight="600" text-anchor="middle" fill="#991B1B">대응</text>
    <text x="575" y="216" font-size="10" text-anchor="middle" fill="#0F0F10">적대적 페르소나 + 다른 모델 패밀리</text>
    <text x="575" y="232" font-size="9" font-style="italic" text-anchor="middle" fill="#6B6B72">(장피엠: Claude vs Codex 교차 비판)</text>
  </g>

  <!-- Q3: Compounding (bottom-left) -->
  <g>
    <rect x="70" y="290" width="310" height="150" rx="6" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
    <text x="225" y="315" font-size="13" font-weight="700" text-anchor="middle" fill="#3730A3">③ 복리 오류</text>
    <text x="225" y="336" font-size="11" text-anchor="middle" fill="#0F0F10">단계당 90% × 5단계 =</text>
    <text x="225" y="358" font-size="20" font-weight="800" text-anchor="middle" fill="#3730A3">59%</text>
    <line x1="100" y1="376" x2="350" y2="376" stroke="#4338CA" stroke-width="0.5" stroke-dasharray="2 2"/>
    <text x="225" y="395" font-size="9" font-weight="600" text-anchor="middle" fill="#3730A3">대응</text>
    <text x="225" y="411" font-size="10" text-anchor="middle" fill="#0F0F10">단계 ≤ 5 또는 HITL 게이트</text>
    <text x="225" y="427" font-size="9" font-style="italic" text-anchor="middle" fill="#6B6B72">(executionPolicy review/approval)</text>
  </g>

  <!-- Q4: Dangerous Autonomy (bottom-right) -->
  <g>
    <rect x="420" y="290" width="310" height="150" rx="6" fill="#FECACA" stroke="#7F1D1D" stroke-width="1.5"/>
    <text x="575" y="315" font-size="13" font-weight="700" text-anchor="middle" fill="#7F1D1D">④ 위험한 자율성</text>
    <text x="575" y="336" font-size="11" text-anchor="middle" fill="#0F0F10">샌드박스 없이 권한 부여 →</text>
    <text x="575" y="356" font-size="11" font-weight="700" text-anchor="middle" fill="#7F1D1D">C/D 드라이브 삭제 사례</text>
    <line x1="450" y1="376" x2="700" y2="376" stroke="#7F1D1D" stroke-width="0.5" stroke-dasharray="2 2"/>
    <text x="575" y="395" font-size="9" font-weight="600" text-anchor="middle" fill="#7F1D1D">대응</text>
    <text x="575" y="411" font-size="10" text-anchor="middle" fill="#0F0F10">adapter capability allowlist</text>
    <text x="575" y="427" font-size="9" font-style="italic" text-anchor="middle" fill="#6B6B72">(rm -rf, DROP/DELETE 차단)</text>
  </g>

</svg>
