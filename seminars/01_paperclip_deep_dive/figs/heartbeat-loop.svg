<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow-hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/>
    </marker>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#FAFAF9"/>

  <!-- center pulse -->
  <circle cx="480" cy="280" r="140" fill="url(#centerGrad)"/>
  <text x="480" y="267" font-size="20" font-weight="650" text-anchor="middle" fill="#0F2C59">DB-backed</text>
  <text x="480" y="293" font-size="20" font-weight="650" text-anchor="middle" fill="#0F2C59">Wakeup Queue</text>
  <text x="480" y="321" font-size="13" text-anchor="middle" fill="#6B6B72">(coalescing + atomic lock)</text>

  <!-- 6 nodes around the circle -->
  <!-- Node 1: top -->
  <g>
    <circle cx="480" cy="75" r="64" fill="#FFFFFF" stroke="#0F2C59" stroke-width="2.5"/>
    <text x="480" y="54" font-size="19" font-weight="700" text-anchor="middle" fill="#2563EB">①</text>
    <text x="480" y="83" font-size="15" font-weight="600" text-anchor="middle" fill="#0F0F10">Issue 생성</text>
    <text x="480" y="105" font-size="11" text-anchor="middle" fill="#6B6B72">cron/webhook/위임</text>
  </g>

  <!-- Node 2: upper right -->
  <g>
    <circle cx="760" cy="175" r="64" fill="#FFFFFF" stroke="#0F2C59" stroke-width="2.5"/>
    <text x="760" y="154" font-size="19" font-weight="700" text-anchor="middle" fill="#2563EB">②</text>
    <text x="760" y="183" font-size="15" font-weight="600" text-anchor="middle" fill="#0F0F10">enqueue</text>
    <text x="760" y="205" font-size="11" text-anchor="middle" fill="#6B6B72">coalescing</text>
  </g>

  <!-- Node 3: lower right -->
  <g>
    <circle cx="760" cy="385" r="64" fill="#FFFFFF" stroke="#0F2C59" stroke-width="2.5"/>
    <text x="760" y="364" font-size="19" font-weight="700" text-anchor="middle" fill="#2563EB">③</text>
    <text x="760" y="393" font-size="15" font-weight="600" text-anchor="middle" fill="#0F0F10">wake</text>
    <text x="760" y="415" font-size="11" text-anchor="middle" fill="#6B6B72">budget 체크</text>
  </g>

  <!-- Node 4: bottom -->
  <g>
    <circle cx="480" cy="485" r="64" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>
    <text x="480" y="464" font-size="19" font-weight="700" text-anchor="middle" fill="#D97706">④</text>
    <text x="480" y="493" font-size="15" font-weight="650" text-anchor="middle" fill="#D97706">atomic checkout</text>
    <text x="480" y="515" font-size="11" text-anchor="middle" fill="#6B6B72">execution lock</text>
  </g>

  <!-- Node 5: lower left -->
  <g>
    <circle cx="200" cy="385" r="64" fill="#FFFFFF" stroke="#0F2C59" stroke-width="2.5"/>
    <text x="200" y="364" font-size="19" font-weight="700" text-anchor="middle" fill="#2563EB">⑤</text>
    <text x="200" y="393" font-size="15" font-weight="600" text-anchor="middle" fill="#0F0F10">adapter 실행</text>
    <text x="200" y="415" font-size="11" text-anchor="middle" fill="#6B6B72">LLM call + skill</text>
  </g>

  <!-- Node 6: upper left -->
  <g>
    <circle cx="200" cy="175" r="64" fill="#FFFFFF" stroke="#059669" stroke-width="3"/>
    <text x="200" y="154" font-size="19" font-weight="700" text-anchor="middle" fill="#059669">⑥</text>
    <text x="200" y="183" font-size="15" font-weight="650" text-anchor="middle" fill="#059669">sleep (DB 영속)</text>
    <text x="200" y="205" font-size="11" text-anchor="middle" fill="#6B6B72">세션 상태 저장</text>
  </g>

  <!-- Arrows around the cycle -->
  <path d="M 543 87 Q 655 110 708 142" fill="none" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-hb)"/>
  <path d="M 770 238 Q 792 288 770 322" fill="none" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-hb)"/>
  <path d="M 708 423 Q 620 463 543 478" fill="none" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-hb)"/>
  <path d="M 417 478 Q 332 463 252 423" fill="none" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-hb)"/>
  <path d="M 190 322 Q 168 288 190 238" fill="none" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-hb)"/>
  <path d="M 252 142 Q 305 110 417 87" fill="none" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-hb)"/>

</svg>
