<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow-role" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <style>
      .bg { fill: #FAFAF9; }
      .card { fill: #ECFDF5; stroke: #059669; stroke-width: 2; }
      .center { fill: #FFFFFF; stroke: #0F2C59; stroke-width: 2; }
      .label { fill: #0F2C59; font-size: 15px; font-weight: 800; }
      .small { fill: #57534E; font-size: 11px; font-weight: 650; }
      .turn { stroke: #059669; stroke-width: 2.5; fill: none; marker-end: url(#arrow-role); }
      .halo { paint-order: stroke fill; stroke: #FAFAF9; stroke-width: 4px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="330"/>
  <rect x="30" y="34" width="800" height="248" rx="12" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="1.5"/>
  <text x="58" y="72" class="label">Group conversation</text>

  <rect class="center" x="350" y="126" width="160" height="78" rx="14"/>
  <text x="430" y="158" text-anchor="middle" class="label">shared thread</text>
  <text x="430" y="180" text-anchor="middle" class="small">turn state</text>

  <rect class="card" x="114" y="78" width="148" height="58" rx="10"/>
  <text x="188" y="103" text-anchor="middle" class="label">Researcher</text>
  <text x="188" y="123" text-anchor="middle" class="small">finds signals</text>

  <rect class="card" x="598" y="78" width="148" height="58" rx="10"/>
  <text x="672" y="103" text-anchor="middle" class="label">Writer</text>
  <text x="672" y="123" text-anchor="middle" class="small">drafts options</text>

  <rect class="card" x="114" y="204" width="148" height="58" rx="10"/>
  <text x="188" y="229" text-anchor="middle" class="label">Critic</text>
  <text x="188" y="249" text-anchor="middle" class="small">challenges gaps</text>

  <rect class="card" x="598" y="204" width="148" height="58" rx="10"/>
  <text x="672" y="229" text-anchor="middle" class="label">Manager</text>
  <text x="672" y="249" text-anchor="middle" class="small">selects next turn</text>

  <path class="turn" d="M262 107 C304 108 324 126 346 146"/>
  <path class="turn" d="M510 146 C540 120 558 108 594 107"/>
  <path class="turn" d="M594 233 C548 230 526 207 506 184"/>
  <path class="turn" d="M350 184 C322 212 300 231 266 233"/>
  <path class="turn" d="M262 233 C300 278 562 278 598 233"/>
  <text x="430" y="292" text-anchor="middle" class="small halo">runtime handoff</text>
</svg>
