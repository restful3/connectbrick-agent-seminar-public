<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 800 290" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow-st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/>
    </marker>
    <marker id="arrow-st-pos" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-st-neg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/>
    </marker>
    <style>
      .edge-label { paint-order: stroke fill; stroke: #FAFAF9; stroke-width: 3px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="80" width="800" height="290" fill="#FAFAF9"/>

  <!-- States -->

  <!-- submitted -->
  <g>
    <rect x="50" y="190" width="130" height="60" rx="30" fill="#FFFFFF" stroke="#0F2C59" stroke-width="2"/>
    <text x="115" y="218" font-size="12" font-weight="700" text-anchor="middle" fill="#0F2C59">제출됨</text>
    <text x="115" y="235" font-size="9" text-anchor="middle" fill="#6B6B72">에이전트가 제출</text>
  </g>

  <!-- pending -->
  <g>
    <rect x="260" y="190" width="130" height="60" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="325" y="218" font-size="12" font-weight="700" text-anchor="middle" fill="#92400E">대기 중</text>
    <text x="325" y="235" font-size="9" text-anchor="middle" fill="#6B6B72">보드 검토 대기</text>
  </g>

  <!-- approved -->
  <g>
    <rect x="480" y="100" width="130" height="60" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="545" y="128" font-size="12" font-weight="700" text-anchor="middle" fill="#065F46">승인됨</text>
    <text x="545" y="145" font-size="9" text-anchor="middle" fill="#065F46">작업 진행 허용</text>
  </g>

  <!-- rejected -->
  <g>
    <rect x="480" y="190" width="130" height="60" rx="6" fill="#FEE2E2" stroke="#E11D48" stroke-width="2"/>
    <text x="545" y="218" font-size="12" font-weight="700" text-anchor="middle" fill="#991B1B">반려됨</text>
    <text x="545" y="235" font-size="9" text-anchor="middle" fill="#991B1B">작업 취소</text>
  </g>

  <!-- revision_requested -->
  <g>
    <rect x="470" y="290" width="170" height="60" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="555" y="318" font-size="12" font-weight="700" text-anchor="middle" fill="#92400E">수정 요청</text>
    <text x="555" y="335" font-size="9" text-anchor="middle" fill="#6B6B72">에이전트가 재제출</text>
  </g>

  <!-- EXEC -->
  <g>
    <rect x="690" y="100" width="80" height="60" rx="30" fill="#0F2C59"/>
    <text x="730" y="135" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">실행</text>
  </g>

  <!-- Edges -->

  <!-- submitted → pending -->
  <line x1="180" y1="220" x2="256" y2="220" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-st)"/>
  <text class="edge-label" x="218" y="212" font-size="10" text-anchor="middle" fill="#6B6B72">큐 등록</text>

  <!-- pending → approved (curve up-right) -->
  <path d="M 390 200 Q 440 175 478 155" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-st-pos)"/>
  <text class="edge-label" x="402" y="174" font-size="10" font-weight="600" fill="#059669">승인 ✓</text>

  <!-- pending → rejected (horizontal) -->
  <line x1="390" y1="220" x2="478" y2="220" stroke="#E11D48" stroke-width="2" marker-end="url(#arrow-st-neg)"/>
  <text class="edge-label" x="434" y="212" font-size="10" font-weight="600" text-anchor="middle" fill="#E11D48">반려 ✗</text>

  <!-- pending → revision_requested (curve down-right) -->
  <path d="M 390 240 Q 440 265 478 295" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-st)"/>
  <text class="edge-label" x="402" y="270" font-size="10" font-weight="600" fill="#D97706">수정 ↺</text>

  <!-- revision_requested → pending (back, dashed, smooth U-curve) -->
  <path d="M 470 320 C 220 320, 200 250, 258 250" fill="none" stroke="#0F2C59" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-st)"/>
  <text class="edge-label" x="335" y="312" font-size="10" fill="#6B6B72">재제출 → 대기</text>

  <!-- approved → EXEC -->
  <line x1="610" y1="130" x2="688" y2="130" stroke="#0F2C59" stroke-width="2" marker-end="url(#arrow-st)"/>
  <text class="edge-label" x="649" y="122" font-size="10" text-anchor="middle" fill="#6B6B72">차단 해제</text>
</svg>
